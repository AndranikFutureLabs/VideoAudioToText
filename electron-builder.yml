appId: com.andranikfuturelabs.videoaudioToText
productName: VideoAudioToText
copyright: Copyright © 2026 AndranikFutureLabs
directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - "!node_modules/**/.cache/**"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
  legalTrademarks: AndranikFutureLabs

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  uninstallDisplayName: "VideoAudioToText"
  deleteAppDataOnUninstall: true

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.png
  category: public.app-category.video
  hardenedRuntime: false
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  icon: resources/icon.png
  category: AudioVideo
  maintainer: AndranikFutureLabs

extraResources:
  - from: resources/
    to: ./
    filter:
      - "**/*"
  - from: scripts/
    to: scripts/
    filter:
      - "**/*"
  - from: logo.jpg
    to: logo.jpg
    filter:
      - "**/*"
